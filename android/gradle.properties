org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true

# Toolchain versions pinned to what we validated in Phase 2.
NDK_VERSION=27.3.13750724

# minSdk 24 (Android 7.0) — required for C++20 std library features via NDK r27.
MIN_SDK=24
TARGET_SDK=35

# Comma-separated list of ABIs to build. Default covers every arch Google
# Play ships to in 2026: 64-bit ARM for modern phones, 32-bit ARM for the
# tail of older devices, and x86_64 for emulators / Chrome OS.
# Override on the command line for faster per-arch iteration, e.g.
#   ./android-build.sh assembleDebug -PARCH_ABI=x86_64
ARCH_ABI=arm64-v8a,armeabi-v7a,x86_64

STL_TYPE=c++_shared
SFML_STATIC=OFF
