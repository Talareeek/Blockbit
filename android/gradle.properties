org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
android.nonTransitiveRClass=true

# Toolchain versions pinned to what we validated in Phase 2.
NDK_VERSION=27.3.13750724

# minSdk 24 (Android 7.0) — required for C++20 std library features via NDK r27.
MIN_SDK=24
TARGET_SDK=35

# Default ABI is production target. Override on the command line for emulator
# testing, e.g. `./android-build.sh assembleDebug -PARCH_ABI=x86_64`.
ARCH_ABI=arm64-v8a

STL_TYPE=c++_shared
SFML_STATIC=OFF
